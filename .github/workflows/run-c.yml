name: Run C Program on macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build-and-run:
    # macOS 최신 버전의 클라우드 VM 사용
    runs-on: macos-latest

    steps:
    # 1. 저장소의 소스 코드를 VM으로 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. main.c 파일을 빌드하여 main이라는 실행 파일 생성
    - name: Compile C program
      run: gcc main.c -o main

    # 3. 컴파일된 main 바이너리 실행
    - name: Execute program
      run: ./main
